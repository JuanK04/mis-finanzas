<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e2e5ec;--accent:#2f6fed;--inc:#15803d;--exp:#c2352b;--incbg:#e3f4e8;--expbg:#fbe7e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--text:#e8eaf0;--muted:#98a0b3;--line:#303644;--accent:#6b9bff;--inc:#4ade80;--exp:#f87171;--incbg:#16301f;--expbg:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--text:#e8eaf0;--muted:#98a0b3;--line:#303644;--accent:#6b9bff;--inc:#4ade80;--exp:#f87171;--incbg:#16301f;--expbg:#3a1c1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.05rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:.85rem}
button.del{background:transparent;color:var(--exp);border:1px solid var(--line)}
.full{width:100%;margin-top:16px}
.link{background:none;color:var(--accent);padding:0;font-weight:600}
.auth{max-width:400px;margin:8vh auto 0}
.auth h1{text-align:center;margin-bottom:4px}
.sub{text-align:center;color:var(--muted);margin:0 0 16px}
.err{color:var(--exp);font-size:.9rem;min-height:1.2em;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.top small{color:var(--muted);display:block;word-break:break-all}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum span{font-size:.78rem;color:var(--muted);display:block}
.sum b{font-size:1.1rem}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px}
.tabs button{padding:6px 12px;font-size:.88rem}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.dot.i{background:var(--incbg);color:var(--inc)}.dot.e{background:var(--expbg);color:var(--exp)}
.info{flex:1;min-width:0;cursor:pointer}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}
.acts{display:flex;gap:6px}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{width:100%;max-width:420px;margin:0;max-height:90%;overflow:auto}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1}
dl{margin:0}dt{font-size:.8rem;color:var(--muted);margin-top:10px}dd{margin:2px 0 0;font-weight:600}
[hidden]{display:none!important}
@media (max-width:480px){.acts button{padding:6px 8px}.sum b{font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n).toLocaleString('es-MX', {style:'currency', currency:'MXN'});
let token = null, user = null, records = [], filter = 'todos', authMode = 'login';
try { token = localStorage.getItem('mf_token'); } catch(e){}
const setToken = t => { token = t; try { t ? localStorage.setItem('mf_token', t) : localStorage.removeItem('mf_token'); } catch(e){} };

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: Object.assign({'Content-Type':'application/json'}, token ? {Authorization:'Bearer ' + token} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    if(res.status === 401 && token){ setToken(null); user = null; authMode = 'login'; renderAuth(); }
    throw new Error(data.error || 'Ocurrió un error. Inténtalo de nuevo.');
  }
  return data;
}

/* ---------- Autenticación ---------- */
function renderAuth(){
  const reg = authMode === 'register';
  $('#app').innerHTML = `
  <div class="auth card">
    <h1>💰 Mis Finanzas</h1>
    <p class="sub">${reg ? 'Crea tu cuenta con tu correo' : 'Inicia sesión para continuar'}</p>
    <label for="em">Correo electrónico</label>
    <input id="em" type="email" autocomplete="email" placeholder="tu@correo.com">
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="Mínimo 6 caracteres">
    <div class="err" id="err"></div>
    <button class="full" id="go">${reg ? 'Registrarme' : 'Entrar'}</button>
    <p class="sub" style="margin-top:14px">${reg ? '¿Ya tienes cuenta?' : '¿Aún no tienes cuenta?'}
      <button class="link" id="sw">${reg ? 'Inicia sesión' : 'Regístrate'}</button></p>
  </div>`;
  $('#sw').onclick = () => { authMode = reg ? 'login' : 'register'; renderAuth(); };
  $('#go').onclick = submitAuth;
  $('#pw').onkeydown = e => { if(e.key === 'Enter') submitAuth(); };
}
async function submitAuth(){
  const email = $('#em').value.trim(), password = $('#pw').value;
  const btn = $('#go'); btn.disabled = true;
  try {
    const r = await api('POST', authMode === 'register' ? '/api/register' : '/api/login', {email, password});
    setToken(r.token); user = r.email;
    await loadApp();
  } catch(e){ $('#err').textContent = e.message; btn.disabled = false; }
}
async function logout(){
  try { await api('POST', '/api/logout'); } catch(e){}
  setToken(null); user = null; records = []; authMode = 'login'; renderAuth();
}

/* ---------- App ---------- */
async function loadApp(){
  records = await api('GET', '/api/records');
  renderApp();
}
function renderApp(){
  const inc = records.filter(r => r.tipo === 'ingreso').reduce((a,r) => a + r.monto, 0);
  const exp = records.filter(r => r.tipo === 'gasto').reduce((a,r) => a + r.monto, 0);
  const list = records.filter(r => filter === 'todos' || r.tipo === filter);
  $('#app').innerHTML = `
  <div class="top">
    <div><h1>💰 Mis Finanzas</h1><small>${esc(user)}</small></div>
    <button class="sec sm" id="out">Salir</button>
  </div>
  <div class="sums">
    <div class="sum"><span>Ingresos</span><b style="color:var(--inc)">${money(inc)}</b></div>
    <div class="sum"><span>Gastos</span><b style="color:var(--exp)">${money(exp)}</b></div>
    <div class="sum"><span>Balance</span><b>${money(inc - exp)}</b></div>
  </div>
  <div class="card">
    <div class="bar">
      <div class="tabs">
        ${['todos','ingreso','gasto'].map(t => `<button class="${filter === t ? '' : 'sec'}" data-f="${t}">${{todos:'Todos',ingreso:'Ingresos',gasto:'Gastos'}[t]}</button>`).join('')}
      </div>
      <button id="add">+ Agregar</button>
    </div>
    ${list.length ? list.map(r => `
      <div class="row">
        <div class="dot ${r.tipo === 'ingreso' ? 'i' : 'e'}">${r.tipo === 'ingreso' ? '↑' : '↓'}</div>
        <div class="info" data-v="${r.id}"><b>${esc(r.concepto)}</b><small>${esc(r.categoria)} · ${r.fecha}</small></div>
        <div class="amt ${r.tipo === 'ingreso' ? 'i' : 'e'}">${r.tipo === 'ingreso' ? '+' : '−'}${money(r.monto)}</div>
        <div class="acts">
          <button class="sec sm" data-e="${r.id}" title="Editar">✏️</button>
          <button class="del sm" data-d="${r.id}" title="Eliminar">🗑️</button>
        </div>
      </div>`).join('') : '<div class="empty">No hay registros todavía. Pulsa “+ Agregar”.</div>'}
  </div>`;
  $('#out').onclick = logout;
  $('#add').onclick = () => openForm();
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; renderApp(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => openDetail(+b.dataset.v));
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(+b.dataset.e));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => remove(+b.dataset.d));
}

function modal(html){
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>';
  m.onclick = e => { if(e.target === m) closeModal(); };
  document.body.appendChild(m);
  return m;
}
const closeModal = () => { const m = $('#modal'); if(m) m.remove(); };

async function openDetail(id){
  let r;
  try { r = await api('GET', '/api/records/' + id); } catch(e){ return alert(e.message); }
  const m = modal(`<h2>Detalle del registro</h2>
    <dl>
      <dt>Tipo</dt><dd>${r.tipo === 'ingreso' ? 'Ingreso' : 'Gasto'}</dd>
      <dt>Concepto</dt><dd>${esc(r.concepto)}</dd>
      <dt>Monto</dt><dd>${money(r.monto)}</dd>
      <dt>Categoría</dt><dd>${esc(r.categoria)}</dd>
      <dt>Fecha</dt><dd>${r.fecha}</dd>
      ${r.nota ? `<dt>Nota</dt><dd>${esc(r.nota)}</dd>` : ''}
    </dl>
    <div class="btns"><button class="sec" id="cl">Cerrar</button><button id="ed">Editar</button></div>`);
  m.querySelector('#cl').onclick = closeModal;
  m.querySelector('#ed').onclick = () => openForm(id);
}

function openForm(id){
  const r = id ? records.find(x => x.id === id) : null;
  const cats = ['Salario','Ventas','Alimentos','Transporte','Vivienda','Servicios','Salud','Ocio','Otros'];
  const m = modal(`<h2>${r ? 'Editar registro' : 'Nuevo registro'}</h2>
    <label>Tipo</label>
    <select id="f-tipo"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option></select>
    <label>Concepto</label><input id="f-con" maxlength="60" placeholder="Ej. Pago de nómina">
    <label>Monto (MXN)</label><input id="f-mon" type="number" min="0.01" step="0.01" inputmode="decimal">
    <label>Categoría</label><select id="f-cat">${cats.map(c => `<option>${c}</option>`).join('')}</select>
    <label>Fecha</label><input id="f-fec" type="date">
    <label>Nota (opcional)</label><input id="f-not" maxlength="120">
    <div class="err" id="ferr"></div>
    <div class="btns"><button class="sec" id="cn">Cancelar</button><button id="sv">Guardar</button></div>`);
  const g = s => m.querySelector(s);
  g('#f-tipo').value = r ? r.tipo : 'gasto';
  g('#f-con').value = r ? r.concepto : '';
  g('#f-mon').value = r ? r.monto : '';
  g('#f-cat').value = r ? r.categoria : 'Otros';
  g('#f-fec').value = r ? r.fecha : new Date().toISOString().slice(0,10);
  g('#f-not').value = r ? (r.nota || '') : '';
  g('#cn').onclick = closeModal;
  g('#sv').onclick = async () => {
    const data = {
      tipo: g('#f-tipo').value, concepto: g('#f-con').value.trim(),
      monto: parseFloat(g('#f-mon').value), categoria: g('#f-cat').value,
      fecha: g('#f-fec').value, nota: g('#f-not').value.trim()
    };
    if(!data.concepto) return g('#ferr').textContent = 'Escribe un concepto.';
    if(!(data.monto > 0)) return g('#ferr').textContent = 'El monto debe ser mayor a 0.';
    if(!data.fecha) return g('#ferr').textContent = 'Elige una fecha.';
    g('#sv').disabled = true;
    try {
      await api(r ? 'PUT' : 'POST', r ? '/api/records/' + r.id : '/api/records', data);
      closeModal(); await loadApp();
    } catch(e){ g('#ferr').textContent = e.message; g('#sv').disabled = false; }
  };
}

function remove(id){
  const r = records.find(x => x.id === id); if(!r) return;
  const m = modal(`<h2>¿Eliminar registro?</h2><p>Se eliminará “${esc(r.concepto)}” (${money(r.monto)}). Esta acción no se puede deshacer.</p>
    <div class="err" id="derr"></div>
    <div class="btns"><button class="sec" id="no">Cancelar</button><button id="si" style="background:var(--exp)">Eliminar</button></div>`);
  m.querySelector('#no').onclick = closeModal;
  m.querySelector('#si').onclick = async () => {
    try { await api('DELETE', '/api/records/' + id); closeModal(); await loadApp(); }
    catch(e){ m.querySelector('#derr').textContent = e.message; }
  };
}

/* ---------- Inicio ---------- */
(async function init(){
  if(token){
    try { user = (await api('GET', '/api/me')).email; await loadApp(); return; } catch(e){ setToken(null); }
  }
  renderAuth();
})();
</script>
</body>
</html>
